name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            elixir: "1.18"
            otp: "27"
          # Oldest supported OTP.
          - os: ubuntu-22.04
            elixir: "1.18"
            otp: "26"
          # macos-14 stopped getting runners (job cancelled with empty steps);
          # align with Release, which builds NIFs on macos-15.
          - os: macos-15
            elixir: "1.18"
            otp: "27"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: "1.91"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.cargo/registry
            ~/.cargo/git
            native/whiff_native/target
          key: ${{ runner.os }}-otp${{ matrix.otp }}-mix-${{ hashFiles('mix.lock') }}-${{ hashFiles('native/whiff_native/Cargo.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
        env:
          WHIFF_BUILD: "1"
      - name: Credo
        run: mix credo --strict
      - name: Doctor
        run: mix doctor
      - name: Tests + coverage
        run: mix coveralls
        env:
          WHIFF_BUILD: "1"

      - name: Docs
        if: matrix.otp == '27'
        run: mix docs --warnings-as-errors

      - name: Dependency audit
        if: runner.os == 'Linux' && matrix.otp == '27'
        run: |
          mix hex.audit
          mix deps.unlock --check-unused

      - name: Native fmt/clippy/test
        if: runner.os == 'Linux' && matrix.otp == '27'
        working-directory: native/whiff_native
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Example package
        if: runner.os == 'Linux' && matrix.otp == '27'
        working-directory: examples/trade_whiffer
        run: |
          mix deps.get
          mix test

  best-effort-windows:
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: dtolnay/rust-toolchain@stable
      - run: mix deps.get
      - run: mix test
        env:
          WHIFF_BUILD: "1"
